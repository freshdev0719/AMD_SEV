# XcodeGen 설정: `brew install xcodegen && xcodegen` 으로 BundangWatch.xcodeproj 생성
name: BundangWatch
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  BundangWatch:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bundangwatch  # 본인 번들 ID로 변경
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 분당실거래
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 개발 중 로컬 서버(http://localhost, Mac의 IP)에 HTTP로 붙기 위한 예외.
        # 배포 서버는 HTTPS를 쓰므로 출시 때도 이 설정만으로 충분하다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
